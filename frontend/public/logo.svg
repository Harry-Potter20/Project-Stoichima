<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stoichima">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Rounded badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Sigma: Σ for Στοίχημα, and the summation of probabilities -->
  <path d="M45 17 L20 17 L32 32 L20 47 L45 47"
        fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Football at the vertex where the probabilities converge -->
  <circle cx="32" cy="32" r="5.6" fill="#0b3d2e"/>
  <circle cx="32" cy="32" r="5.6" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <path d="M32 28.2 L35.6 30.8 L34.2 35.1 L29.8 35.1 L28.4 30.8 Z" fill="#ffffff"/>
</svg>
